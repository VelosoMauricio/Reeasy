services:
  db:
    image: mysql:8.0
    container_name: reeasy-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${root_password}
      MYSQL_DATABASE: ${name}
      MYSQL_USER: ${user}
      MYSQL_PASSWORD: ${password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    command: --bind-address=0.0.0.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  image-analyzer:
    build: ../imageAnalizer
    container_name: reeasy-image-analyzer
    ports:
      - "11434:11434"
    volumes:
      - ../imageAnalizer/model:/app/model
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11434/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build: .
    container_name: reeasy-api-dev
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${name}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${user}
      SPRING_DATASOURCE_PASSWORD: ${password}
      SPRING_YOLO_API_URL: http://image-analyzer:11434
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      image-analyzer:
        condition: service_started

volumes:
  mysql-data:
